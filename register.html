<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Become a Blood Donor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Donor Registration Section -->
    <section class="become-donor">

        <!-- Back to Home -->
        <a href="index.html" class="back-home">
            &larr; Back to Home
        </a>

        <h2>Become a Blood Donor</h2>

        <p>Register yourself and help save someone's life.</p>

        <!-- Registration Form -->
        <form class="donor-form" id="donor-form">

            <!-- Full Name -->
            <input type="text" id="donor-name" name="name" placeholder="Enter Full Name" required>

            <!-- Blood Group -->
            <select id="donor-blood" name="blood-group" required>

                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>

            </select>

            <!-- City Area -->
            <input type="text" id="donor-area" name="area" placeholder="Enter City Area" required>

            <!-- Contact Number -->
            <input type="tel" id="donor-contact" name="contact" placeholder="Enter 10-Digit Contact Number"
                pattern="[0-9]{10}" maxlength="10" required>

            <!-- Submit Button -->
            <button type="submit">
                Register as Donor
            </button>

            <p id="success-message" class="success-message"></p>
            
        </form>

    </section>

    <script src="script.js"></script>

</body>

</html>
